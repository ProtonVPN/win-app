name: Windows client smoke build

on:
  workflow_dispatch:

jobs:
  build-client:
    name: Build Windows client and service projects
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show tool versions
        run: |
          dotnet --info
          go version
          msbuild -version
          rustc --version
          cargo --version

      - name: Restore client project
        run: dotnet restore src/Client/ProtonVPN.Client/ProtonVPN.Client.csproj --runtime win-x64

      - name: Restore service project
        run: dotnet restore src/ProtonVPN.Service/ProtonVPN.Service.csproj --runtime win-x64

      - name: Build client project
        run: dotnet build src/Client/ProtonVPN.Client/ProtonVPN.Client.csproj --configuration Release --runtime win-x64 --no-restore -p:Platform=x64

      - name: Build service project
        run: dotnet build src/ProtonVPN.Service/ProtonVPN.Service.csproj --configuration Release --runtime win-x64 --no-restore -p:Platform=x64

      - name: Create patch artifact folder
        run: |
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'src\bin'
          $patchDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ProtonVPN.Client.Patch'
          New-Item -ItemType Directory -Force -Path $patchDir | Out-Null

          function Copy-FirstMatchingFile {
            param(
              [Parameter(Mandatory = $true)] [string] $FileName,
              [Parameter(Mandatory = $true)] [string] $Destination
            )

            $matches = Get-ChildItem $sourceDir -Recurse -File -Filter $FileName | Sort-Object FullName
            if (!$matches -or $matches.Count -eq 0) {
              Write-Host "Available DLLs under $sourceDir:"
              Get-ChildItem $sourceDir -Recurse -File -Filter '*.dll' | Select-Object -ExpandProperty FullName | Sort-Object
              throw "Required patch file missing: $FileName"
            }

            Copy-Item $matches[0].FullName $Destination -Force
            Write-Host "Copied $FileName from $($matches[0].FullName)"
          }

          $requiredFiles = @(
            'ProtonVPN.Client.dll',
            'ProtonVPN.Client.Core.dll',
            'ProtonVPN.Client.Settings.dll',
            'ProtonVPNService.dll'
          )

          foreach ($file in $requiredFiles) {
            Copy-FirstMatchingFile -FileName $file -Destination $patchDir
          }

          $optionalFiles = @(
            'ProtonVPN.Client.pri',
            'resources.pri'
          )

          foreach ($file in $optionalFiles) {
            $matches = Get-ChildItem $sourceDir -Recurse -File -Filter $file | Sort-Object FullName
            if ($matches -and $matches.Count -gt 0) {
              Copy-Item $matches[0].FullName $patchDir -Force
              Write-Host "Copied $file from $($matches[0].FullName)"
            }
          }

          Get-ChildItem $sourceDir -Recurse -File -Include '*.xbf' | ForEach-Object {
            $relativePath = [System.IO.Path]::GetRelativePath($sourceDir, $_.FullName)
            $targetPath = Join-Path $patchDir $relativePath
            $targetDirectory = Split-Path $targetPath -Parent
            New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null
            Copy-Item $_.FullName $targetPath -Force
          }

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-client-patch
          path: artifacts/ProtonVPN.Client.Patch

      - name: Upload build output artifact
        if: always() && hashFiles('src/bin/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: protonvpn-client-bin
          path: src/bin
